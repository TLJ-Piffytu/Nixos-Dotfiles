[bar.default]
background_opacity = 0.93999997898936272
center = [ "taskbar" ]
concave_edge_corners = false
end = [ "media", "network", "volume", "clock", "battery" ]
margin_ends = 0
radius = 0
start = [ "session", "workspaces" ]
thickness = 25
widget_spacing = 10

[control_center]
hidden_tabs = [ "bluetooth", "screen-time" ]

[dock]
background_opacity = 0.91999997943639755

[location]
address = "Újfehértó, Hungary"

[lockscreen]
blurred_desktop = true
transition = [ "diamond", "honeycomb", "pixel" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 538.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 256.0
    cx = 835.0
    cy = 232.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = -0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_radius = 0
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 406.0
    cy = 232.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        visualization_mode = "bars_rings"

[notification]
history_retention_hours = 96
max_visible = 2
width = 300

[osd]
orientation = "vertical"
position = "bottom_center"
position_vertical = "center_right"

[shell]
corner_radius_scale = 0.0
settings_window_translucent = true

    [shell.launcher]
    layout = "simple"

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "soft"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Rosé Pine"
custom_palette = "noctalia-wallpaper-mc"
mode = "dark"
source = "custom"

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/xy3phr4gvxhsdkvb4qkiibjqksl7pssw-noctalia-5.3.0/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/xy3phr4gvxhsdkvb4qkiibjqksl7pssw-noctalia-5.3.0/share/noctalia/assets/noctalia-wallpaper.png"

[widget.battery]
show_label = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.taskbar]
group_single_icon_per_app = true
show_workspace_label = false
workspace_group_capsule = false

[widget.volume]
show_label = false

[widget.workspaces]
show_all_outputs = true
